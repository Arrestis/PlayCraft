name: Build packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # build.rs bundles libmpv (FFmpeg, DVD, Blu-ray, CD) and libaacs/libbdplus into target/release/engine
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PlayCraft | Out-Null
          Copy-Item target/release/playcraft.exe dist/PlayCraft/
          Copy-Item -Recurse target/release/engine dist/PlayCraft/engine
          Copy-Item README.md, LICENSE, NOTICE.md, CHANGELOG.md dist/PlayCraft/
          Compress-Archive -Path dist/PlayCraft -DestinationPath PlayCraft-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: PlayCraft-windows-x64.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # .deb (pulls in libmpv, libbluray, libaacs, libbdplus, libdvdnav through apt) + .tar.gz
      - run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # .app with the engine and Blu-ray libraries inside, packed into a .dmg
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/PlayCraft-macos.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
