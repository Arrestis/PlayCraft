name: Build packages

# Builds PlayCraft for every supported system, with files named like the ArtCraft apps
# (playcraft-<version>-<system>-<processor>.<type>). Pushing a version tag such as v0.2.0
# publishes a GitHub Release with all the downloads and a SHA256SUMS.txt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64 }
          - { target: i686-pc-windows-msvc, arch: x86 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # build.rs bundles libmpv (FFmpeg) and the DVD/Blu-ray libraries for this processor
      - run: cargo build --release --target ${{ matrix.target }} -vv
        env:
          CARGO_TERM_VERBOSE: "true"
      - name: Show bundled engine
        shell: pwsh
        run: |
          Get-ChildItem target/${{ matrix.target }}/release/engine -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String -Width 200
          Get-ChildItem target/${{ matrix.target }}/release/build -Directory -Filter "playcraft-*" | ForEach-Object { Get-Content (Join-Path $_.FullName "output") -ErrorAction SilentlyContinue; Get-Content (Join-Path $_.FullName "stderr") -ErrorAction SilentlyContinue }
      - name: Installer (.msi) and portable zip
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          ./scripts/package-windows.ps1 -Target ${{ matrix.target }} -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*-portable.zip

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, target: "" }
          - { runner: ubuntu-22.04-arm, arch: aarch64, target: "" }
          - { runner: ubuntu-22.04, arch: riscv64, target: riscv64gc-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # AppImage (+ .zsync), .deb, .rpm, Arch .pkg.tar.zst and .tar.gz
      # (riscv64 is cross-built: .deb, .rpm, .tar.gz)
      - run: bash scripts/build-linux.sh
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/playcraft-app-*.tar.gz

  macos-universal:
    name: macOS universal
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - run: bash scripts/make-macos-universal.sh dist/playcraft-app-arm64.tar.gz dist/playcraft-app-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*-macos-universal.dmg

  release:
    name: Publish release
    needs: [windows, linux, macos, macos-universal]
    # Publish whatever built, even if one system failed.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f playcraft-app-*.tar.gz
          sha256sum playcraft-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: PlayCraft ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/playcraft-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
